<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Motion Composition v30</title><style>body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh}.frame{width:min(960px,94vw);aspect-ratio:16/9;border-radius:28px;overflow:hidden;position:relative;background:radial-gradient(circle at 25% 20%,#f8ead0,#c9a96b33 28%,transparent 45%),linear-gradient(135deg,#f7f2ea,#dcebf1)}.orb{position:absolute;inset:20%;background:#fff8;border-radius:50%;filter:blur(60px);animation:float 7s ease-in-out infinite}.copy{position:absolute;left:8%;bottom:12%;max-width:620px;color:#1e2428}.copy small{letter-spacing:.16em;text-transform:uppercase}.copy h1{font:54px/.95 Georgia,serif;margin:12px 0}.cards{position:absolute;right:7%;top:12%;display:grid;gap:12px}.card{background:#ffffffcc;border:1px solid #e4d6bd;border-radius:18px;padding:14px 18px;backdrop-filter:blur(10px)}@keyframes float{50%{transform:translate(8%,-6%) scale(1.08)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><section class="frame"><div class="orb"></div><div class="cards"><div class="card">Врачи</div><div class="card">Сертификаты</div><div class="card">Диагностика</div></div><div class="copy"><small>Premium dental clinic</small><h1>Спокойный премиальный hero loop</h1><p>Reduced-motion fallback: static poster.</p></div></section></body></html>
