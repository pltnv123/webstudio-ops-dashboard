<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Example 003 Motion Composition</title><style>:root{--bg:#11100e;--paper:#e7ded1;--brass:#c59b5f;--leather:#4a2d23;--muted:#a89b8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,Arial,sans-serif}main{min-height:100vh;padding:56px;display:grid;gap:28px}.hero{border:1px solid rgba(197,155,95,.45);border-radius:28px;padding:52px;background:radial-gradient(circle at 72% 20%,rgba(197,155,95,.18),transparent 34%),linear-gradient(135deg,rgba(74,45,35,.55),rgba(17,16,14,.92))}h1{font:600 clamp(42px,7vw,104px)/.88 Georgia,serif;letter-spacing:-.045em;margin:0 0 20px}.eyebrow{color:var(--brass);text-transform:uppercase;letter-spacing:.22em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid rgba(231,222,209,.18);border-radius:20px;padding:22px;background:rgba(255,255,255,.035)}.cta{display:inline-flex;padding:15px 20px;border-radius:999px;background:var(--brass);color:#15110d;text-decoration:none;font-weight:800}.ghost{background:transparent;color:var(--paper);border:1px solid var(--brass)}@media(max-width:760px){main{padding:22px}.grid{grid-template-columns:1fr}.hero{padding:30px}h1{font-size:48px}}</style><style>body{width:1080px;height:1920px;overflow:hidden}main{padding:90px}.hero{min-height:1500px;display:flex;flex-direction:column;justify-content:center}.line{height:4px;background:var(--brass);animation:grow 4s ease infinite}@keyframes grow{0%{width:0}50%{width:82%}100%{width:82%}}@media(prefers-reduced-motion:reduce){.line{animation:none;width:82%}}</style><main><section class="hero"><p class="eyebrow">Premium Barber Club</p><h1>Видео hero + Telegram запись</h1><div class="line"></div><p style="font-size:42px;color:var(--muted)">Мужской салон в Москве. Концепт #003.</p></section></main></html>
